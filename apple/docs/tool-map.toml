# Desktop panel.* and tool.* UI commands (crates/ui-egui/src/menus.rs UI_COMMANDS) -> where the iOS app has them.
# Checked by scripts/tool-coverage.sh: every desktop panel.* / tool.* id needs an entry with `ios` or `excluded`.

[panel.edit]
ios = "Persistent dock tab > Edit (iPad), tool strip > Edit (iPhone)"
[panel.profiles]
ios = "Persistent dock tab > Profiles (iPad), tool strip > Profiles (iPhone)"
[panel.crop]
ios = "Persistent dock tab > Crop (iPad), tool strip > Crop (iPhone); crop overlay on the loupe"
[panel.remove]
ios = "Persistent dock tab > Remove (iPad), tool strip > Remove (iPhone)"
[panel.masking]
ios = "Persistent dock tab > Masking (iPad), tool strip > Masking (iPhone)"
[panel.redeye]
ios = "Persistent dock tab > Red Eye (iPad), tool strip > Red Eye (iPhone)"
[panel.presets]
ios = "Persistent dock tab > Presets (iPad), tool strip > Presets (iPhone)"
[panel.info]
ios = "Persistent dock tab > Info (iPad), sheet (iPhone)"
[panel.keywords]
ios = "Persistent dock tab > Keywords (iPad), sheet (iPhone)"
[panel.versions]
ios = "Persistent dock tab > Versions (iPad), sheet (iPhone)"
[panel.activity]
ios = "Persistent dock tab > History / Activity (iPad), sheet (iPhone)"
[panel.close]
ios = "Inspector close button / sheet dismiss"

[tool.brush]
ios = "Masking panel or command palette > Brush; Apple Pencil on the loupe"
[tool.linear]
ios = "Masking panel or command palette > Linear Gradient"
[tool.radial]
ios = "Masking panel or command palette > Radial Gradient"
[tool.wbPicker]
ios = "Edit panel > White Balance eyedropper (tap the loupe)"
[tool.guidedUpright]
ios = "Crop panel > Guided Upright (draw guides on the loupe)"
[tool.none]
ios = "Command palette or Done"
[tool.done]
ios = "Done button on the options bar"
[tool.keywordPainter]
excluded = "Keyword Painter paints keywords by clicking photos with a held mouse tool; use multi-select + Keywords panel on touch"
