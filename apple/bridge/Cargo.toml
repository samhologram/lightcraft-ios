[package]
name = "lightcraft-apple"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Fork-only crate: its own workspace so the upstream workspace manifest stays untouched.
[workspace]

[lib]
crate-type = ["staticlib", "lib"]
name = "lightcraft_apple"

[dependencies]
lightcraft-engine = { path = "../../crates/engine" }
lightcraft-develop = { path = "../../crates/develop" }
lightcraft-catalog = { path = "../../crates/catalog" }
lightcraft-pipeline = { path = "../../crates/pipeline" }
lightcraft-geom = { path = "../../crates/geom" }
serde_json = "1"
uniffi = "0.32"
thiserror = "2"

[dev-dependencies]

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
